<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: brown;
            text-decoration: none;
        }
        a:visited {

        }
        a:hover {
            color: black;

        }
        a:active {
            color: burlywood;
        }
    </style>
</head>
<body>
