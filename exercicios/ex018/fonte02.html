<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'Angelia';
            src: url('fonts/Angelia\ Beauty.ttf')
            ('opentype'), url('fonts/Angelia\ Beauty.ttf') format('truetype');
            /* tipos de fontes ()
            opentype (otf)
            truetype (ttf) 
            embedded-opentype
            truetype-aat (Apple Advanced Typography)
            svg */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        h1 {
            font-family: 'Angelia', 'Times New Roman', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
